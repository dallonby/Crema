name: Crema

options:
  bundleIdPrefix: coffee.crema
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  generateEmptyDirectories: true

# CremaKit comes from the sibling Swift Package.
packages:
  CremaKit:
    path: .

# Common settings for both app targets.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  # ────────────────────────────────────────────────────────────────────
  # iOS / iPadOS app — iPad-first, iPhone-functional
  # ────────────────────────────────────────────────────────────────────
  Crema-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CremaApp
        buildPhase: sources
        excludes:
          - "Resources/**"
          - "Generated-*-Info.plist"
      - path: Sources/CremaApp/Resources
        buildPhase: resources
    dependencies:
      - package: CremaKit
        product: CremaKit
    info:
      path: Sources/CremaApp/Generated-iOS-Info.plist
      properties:
        CFBundleDisplayName: Crema
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: "Crema connects to your Wendougee espresso machine over Bluetooth LE to send brew profiles and read live pressure / flow / temperature data."
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ── Profile sharing: deep links + .crema file open ──
        CFBundleURLTypes:
          - CFBundleURLName: coffee.crema.app
            CFBundleURLSchemes: [crema]
          # Google OAuth — set CFBundleURLSchemes to your reversed-client-id
          # from Google Cloud Console once configured. Placeholder for now.
          # - CFBundleURLName: coffee.crema.app.google
          #   CFBundleURLSchemes: [com.googleusercontent.apps.YOUR-ID]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: coffee.crema.profile
            UTTypeDescription: Crema Brew Profile
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [crema]
              public.mime-type: [application/json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crema Profile
            LSHandlerRank: Owner
            LSItemContentTypes: [coffee.crema.profile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.crema.app
        PRODUCT_NAME: Crema
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: YDGQZ6G5L9
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "$(PROJECT_DIR)/$(TARGET_NAME).entitlements"

  # ────────────────────────────────────────────────────────────────────
  # macOS app — same Sources/CremaApp shell, different platform
  # ────────────────────────────────────────────────────────────────────
  Crema-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CremaApp
        buildPhase: sources
        excludes:
          - "Resources/**"
          - "Generated-*-Info.plist"
      - path: Sources/CremaApp/Resources
        buildPhase: resources
    dependencies:
      - package: CremaKit
        product: CremaKit
    info:
      path: Sources/CremaApp/Generated-macOS-Info.plist
      properties:
        CFBundleDisplayName: Crema
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHumanReadableCopyright: "© 2026"
        NSBluetoothAlwaysUsageDescription: "Crema connects to your Wendougee espresso machine over Bluetooth LE to send brew profiles and read live pressure / flow / temperature data."
        CFBundleURLTypes:
          - CFBundleURLName: coffee.crema.app
            CFBundleURLSchemes: [crema]
          # - CFBundleURLName: coffee.crema.app.google
          #   CFBundleURLSchemes: [com.googleusercontent.apps.YOUR-ID]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: coffee.crema.profile
            UTTypeDescription: Crema Brew Profile
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [crema]
              public.mime-type: [application/json]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Crema Profile
            LSHandlerRank: Owner
            LSItemContentTypes: [coffee.crema.profile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.crema.app
        PRODUCT_NAME: Crema
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: YDGQZ6G5L9
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "$(PROJECT_DIR)/$(TARGET_NAME).entitlements"
