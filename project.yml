name: Crema

options:
  bundleIdPrefix: coffee.crema
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  generateEmptyDirectories: true

# CremaKit comes from the sibling Swift Package.
packages:
  CremaKit:
    path: .

# Common settings for both app targets.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  # ────────────────────────────────────────────────────────────────────
  # iOS / iPadOS app — iPad-first, iPhone-functional
  # ────────────────────────────────────────────────────────────────────
  Crema-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CremaApp
        buildPhase: sources
        excludes:
          - "Resources/**"
      - path: Sources/CremaApp/Resources
        buildPhase: resources
    dependencies:
      - package: CremaKit
        product: CremaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.crema.app
        PRODUCT_NAME: Crema
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Crema connects to your Wendougee espresso machine over Bluetooth LE to send brew profiles and read live pressure / flow / temperature data."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_CFBundleDisplayName: Crema
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  # ────────────────────────────────────────────────────────────────────
  # macOS app — same Sources/CremaApp shell, different platform
  # ────────────────────────────────────────────────────────────────────
  Crema-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/CremaApp
        buildPhase: sources
        excludes:
          - "Resources/**"
      - path: Sources/CremaApp/Resources
        buildPhase: resources
    dependencies:
      - package: CremaKit
        product: CremaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: coffee.crema.app
        PRODUCT_NAME: Crema
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Crema connects to your Wendougee espresso machine over Bluetooth LE to send brew profiles and read live pressure / flow / temperature data."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_CFBundleDisplayName: Crema
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
